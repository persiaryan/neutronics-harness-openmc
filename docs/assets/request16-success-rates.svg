<rect class="luna" x="134" y="172.8" width="60" height="187.2"/>
<text class="value" x="164" y="162.8" text-anchor="middle">72%</text>
<rect class="sol" x="206" y="120.8" width="60" height="239.2"/>
<text class="value" x="236" y="110.8" text-anchor="middle">92%</text>
<text class="value" x="200" y="385" text-anchor="middle">A</text>
