<text class="value" x="418" y="385" text-anchor="middle">B</text>
<rect class="luna" x="570" y="214.4" width="60" height="145.6"/>
<text class="value" x="600" y="204.4" text-anchor="middle">56%</text>
<rect class="sol" x="642" y="141.6" width="60" height="218.4"/>
<text class="value" x="672" y="131.6" text-anchor="middle">84%</text>
<text class="value" x="636" y="385" text-anchor="middle">C</text>
<text class="caption" x="84" y="414">A: guided construction · B: A + boundaries · C: B + smoke</text>
<text class="caption" x="84" y="437">150 sessions · five tasks × five repeats per setup/condition · zero retries</text>
