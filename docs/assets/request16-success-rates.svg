<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="title desc">
<title id="title">Request-16 development study: verified protocol success</title>
<desc id="desc">Luna A 72%, B 68%, C 56%. Sol A 92%, B 100%, C 84%. 150 assignments; five tasks and five repeats per setup and condition. Descriptive rates without significance claims.</desc>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1f2328;font-size:14px}.bg{fill:#ffffff}.grid{stroke:#d0d7de;stroke-width:1}.luna{fill:#0969da}.sol{fill:#bc4c00}.value{font-weight:650}.caption{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e6edf3}.bg{fill:#0d1117}.grid{stroke:#3d444d}.luna{fill:#58a6ff}.sol{fill:#f0883e}}</style>
<rect class="bg" width="780" height="470" rx="10"/>
<text x="84" y="29" font-size="18" font-weight="650">Request-16 development study</text>
<rect class="luna" x="84" y="45" width="14" height="14"/>
<text x="106" y="57">GPT-5.6 Luna</text>
<rect class="sol" x="298" y="45" width="14" height="14"/>
